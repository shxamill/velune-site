name: Bug report
description: Report a reproducible problem with the Velune website.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Do not include secrets or private client material."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: false
  - type: input
    id: viewport
    attributes:
      label: Viewport size
      description: For example, 1440 × 900 or 390 × 844.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or console output
      description: Redact private information and secrets.
    validations:
      required: false
